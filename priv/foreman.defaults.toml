repos = []

[board]
timezone = "America/Chicago"
week_repos = ["work"]
swimlanes = "project"
stale_session_after = "2h"

[[columns]]
title = "Queued"
stages = ["queued"]

[[columns]]
title = "In flight"
stages = ["dispatched", "building"]

[[columns]]
title = "Review"
stages = ["reported", "in_review"]

[[columns]]
title = "Shipping"
stages = ["committed", "pr_open", "merged"]

[[columns]]
title = "Done"
stages = ["done"]
collapsed = true

[[views]]
key = "open"
title = "Open"
statuses = ["open", "in_progress", "blocked", "deferred", "parked"]

[[views]]
key = "in-flight"
title = "In flight"
stages = ["dispatched", "building"]

[[views]]
key = "stale"
title = "Stale"
stale = true

[[views]]
key = "all"
title = "All"

[backfill]
closed = "done"
default = "queued"

[epics]
