@property --surface-level {

  inherits: false;
  initial-value: 1;
}
@container fluxon style(--surface-level: 1) {
  .surface {
    --surface-level: 2;
  }
}
@container fluxon style(--surface-level: 2) {
  .surface {
    --surface-level: 3;
  }
}
@container fluxon style(--surface-level: 3) {
  .surface {
    --surface-level: 4;
  }
}

  }

@keyframes fluxon-loading-spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes fluxon-loading-bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}
@keyframes fluxon-loading-fade {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.2;
  }
}
@keyframes fluxon-loading-scale {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(0.1);
  }
}
@keyframes fluxon-loading-bars-scale-fade {
  0% {
    y: 1px;
    height: 22px;
  }
  93.75% {
    y: 5px;
    height: 14px;
    opacity: 0.2;
  }
}
@keyframes fluxon-loading-bars-fade {
  93.75%, 100% {
    opacity: 0.2;
  }
}
@keyframes fluxon-loading-bars-scale {
  0%, 66.66% {
    animation-timing-function: cubic-bezier(0.36, 0.61, 0.3, 0.98);
    y: 6px;
    height: 12px;
  }
  33.33% {
    animation-timing-function: cubic-bezier(0.36, 0.61, 0.3, 0.98);
    y: 1px;
    height: 22px;
  }
}
:root {
  font-family: Inter, system-ui, sans-serif;
}
html[data-theme=light] {
  color-scheme: light;
}
html[data-theme=dark] {
  color-scheme: dark;
}
body {
  margin: 0;
  background: var(--background-base);
}
.bb-panel {
  border: 1px solid var(--border-base);
  border-radius: 10px;
  background: var(--surface);
  padding: 16px;
  box-shadow: var(--shadow-base);
}
.bb-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--foreground-softer);
}
.bb-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 36px;
  padding: 0 10px;
  border-radius: 8px;
  font-weight: 500;
  transition: background .15s;
}
.bb-nav:hover, .bb-theme:hover {
  background: var(--background-accent);
}
.bb-nav:focus-visible {
  outline: 2px solid var(--foreground);
  outline-offset: 2px;
}
a.bb-nav-active {
  background: light-dark(#e4e4e7, #3f3f46);
  color: var(--foreground);
}
.bb-theme {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  width: 36px;
  border: 1px solid var(--border-base);
  border-radius: 8px;
  cursor: pointer;
}
.bb-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
.bb-table th {
  text-align: left;
  font-weight: 500;
  color: var(--foreground-softer);
  font-size: 12px;
  padding: 8px 12px;
  background: var(--background-sunken);
}
.bb-table td {
  padding: 10px 10px;
  white-space: nowrap;
  border-top: 1px solid var(--border-base);
  vertical-align: middle;
}
[data-phx-session], [data-phx-teleported-src] {
  display: contents;
}
.bb-switch {
  appearance: none;
  position: relative;
  width: 36px;
  height: 20px;
  border-radius: 99px;
  background: var(--background-switch);
}
.bb-switch::after {
  content: "";
  position: absolute;
  left: 2px;
  top: 2px;
  width: 16px;
  height: 16px;
  border-radius: 99px;
  background: white;
  box-shadow: 0 1px 2px #0003;
}
.bb-switch:checked {
  background: var(--primary);
}
.bb-switch:checked::after {
  left: 18px;
  background: var(--foreground-primary);
}
.bb-initiative-panel {
  border: 1px solid var(--border-base);
  border-radius: 10px;
  overflow: hidden;
}
.bb-section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--background-sunken);
  font-weight: 600;
}
.bb-initiative-grid {
  display: grid;
  grid-template-columns: 130px minmax(240px,1fr) 100px 130px 86px 50px 35px;
  gap: 16px;
  align-items: center;
  min-width: 970px;
}
.bb-initiative-row {
  padding: 12px 16px;
  border-top: 1px solid var(--border-base);
  transition: background .15s;
}
.bb-initiative-head {
  padding: 10px 16px;
  font-size: 12px;
  color: var(--foreground-softer);
  background: var(--background-sunken);
}
.bb-section-label {
  padding: 8px 16px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .05em;
  background: var(--background-sunken);
  color: var(--foreground-softer);
}
.bb-progress {
  height: 6px;
  background: var(--background-sunken);
  border: 1px solid var(--border-base);
  border-radius: 99px;
  overflow: hidden;
}
.bb-progress span {
  display: block;
  height: 100%;
  background: #22c55e;
}
.bb-histogram {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 28px;
  border-bottom: 1px solid var(--border-base);
}
.bb-histogram span {
  width: 11px;
  border-radius: 2px 2px 0 0;
}
.bb-hist-0 {
  background: #a1a1aa;
}
.bb-hist-1 {
  background: #3b82f6;
}
.bb-hist-2 {
  background: #eab308;
}
.bb-hist-3 {
  background: #22c55e;
}
.bb-hist-4 {
  background: #71717a;
}
.bb-filters .fieldset {
  margin: 0;
  max-width: 210px;
}
.bb-filters .label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--foreground-softer);
}
.bb-filter-control {
  display: block;
  width: 100%;
  height: 36px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--border-base);
  background: var(--background-base);
  color: var(--foreground);
  font-size: 13px;
  box-shadow: 0 1px 2px #0000000d;
}
.bb-ticket {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
}
.bb-ticket-id {
  grid-row: 1;
  grid-column: 1;
}
.bb-ticket-stage {
  grid-row: 1;
  grid-column: 2;
}
.bb-ticket-title {
  grid-column: 1 / -1;
  overflow-wrap: anywhere;
}
@media (min-width: 768px) {
  .bb-ticket {
    display: flex;
  }
}
.bb-project-dot {
  width: 8px;
  height: 8px;
  border-radius: 3px;
  flex-shrink: 0;
  background: #8b5cf6;
}
.bb-project-row:nth-child(3n) .bb-project-dot {
  background: #14b8a6;
}
.bb-project-row:nth-child(3n + 1) .bb-project-dot {
  background: #ec4899;
}
.bb-graph-scroll {
  scrollbar-color: var(--foreground-softer) var(--background-sunken);
  scrollbar-width: auto;
}
.bb-graph-scroll::-webkit-scrollbar {
  height: 12px;
}
.bb-graph-scroll::-webkit-scrollbar-track {
  background: var(--background-sunken);
}
.bb-graph-scroll::-webkit-scrollbar-thumb {
  background: var(--foreground-softer);
  border: 3px solid var(--background-sunken);
  border-radius: 6px;
}
.bb-graph-scroll:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
.fm-markdown {

  max-width: 100%;
  font-size: 14px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.fm-markdown > :first-child {
  margin-top: 0;
}
.fm-markdown > :last-child {
  margin-bottom: 0;
}

  line-height: 1.35;
  margin: 1.8em 0 .7em;
  letter-spacing: -.015em;
}
.fm-markdown h1 {
  font-size: 1.8em;
}
.fm-markdown h2 {
  font-size: 1.4em;
  border-bottom: 1px solid var(--border-base);
  padding-bottom: .4em;
}

/* ---- Mockup-only additions. Everything uses the board's own tokens. ----
   Classes named bb-session-* are the ones the build would add to assets/css/app.css.
   Classes named mk-* are mockup chrome (the variant switcher) and are not part of the design. */
:root:not([data-theme]) { color-scheme: light dark; }
html[data-theme=light] { color-scheme: light; }
html[data-theme=dark] { color-scheme: dark; }
body { margin: 0; background: var(--background-base); color: var(--foreground); }

/* mockup switcher */
.mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px dashed var(--border-base); background: var(--background-sunken); font: 12px/1.4 Inter, system-ui, sans-serif; color: var(--foreground-softer); }
.mk-bar b { color: var(--foreground); font-weight: 600; }
.mk-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.mk-group button { border: 1px solid var(--border-base); background: var(--background-base); color: var(--foreground); border-radius: 6px; padding: 3px 8px; font: inherit; cursor: pointer; }
.mk-group button[aria-pressed=true] { background: var(--primary); color: var(--background-base); border-color: var(--primary); }
.mk-note { flex-basis: 100%; }
body.mk-shot .mk-bar { display: none; }

/* shared session row parts */
.bb-session-name { font-weight: 500; }
.bb-session-name:hover { text-decoration: underline; }
.bb-session-meta { font-size: 12px; color: var(--foreground-softer); }
.bb-session-dead { opacity: .62; }
.bb-session-note { font-size: 12px; color: var(--foreground-softer); display: inline-flex; align-items: center; gap: 4px; }
.bb-session-iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; color: var(--foreground-softer); cursor: pointer; border: 1px solid transparent; background: transparent; }
.bb-session-iconbtn:hover { background: var(--background-sunken); color: var(--foreground); }
.bb-session-iconbtn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.bb-session-iconbtn[aria-disabled=true] { opacity: .35; cursor: not-allowed; }
.bb-session-cards { font-size: 12px; font-weight: 500; text-decoration: underline; text-decoration-color: color-mix(in oklab, currentColor 30%, transparent); text-underline-offset: 4px; }
.bb-session-age { font-size: 12px; color: var(--foreground-softer); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bb-session-live { display: inline-flex; align-items: center; gap: 6px; }
.bb-session-live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--success, oklch(0.7 0.15 150)); }
.bb-session-live[data-state=stale]::before { background: var(--warning); }
.bb-session-live[data-state=off]::before { background: var(--foreground-softest); }
.bb-session-banner { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 12px; border: 1px solid var(--border-base); border-left: 3px solid var(--warning); border-radius: 10px; background: var(--surface); padding: 12px 16px; }
.bb-session-banner[data-tone=danger] { border-left-color: var(--danger); }
.bb-session-banner .hero-exclamation-triangle, .bb-session-banner .hero-signal-slash { flex: none; margin-top: 1px; }
.bb-session-stale { opacity: .55; pointer-events: none; }
.bb-session-skel { display: block; height: 12px; border-radius: 4px; background: var(--background-sunken); }
@media (prefers-reduced-motion: no-preference) {
  .bb-session-skel { background: linear-gradient(90deg, var(--background-sunken) 0%, color-mix(in oklab, var(--background-sunken), var(--foreground) 6%) 50%, var(--background-sunken) 100%); background-size: 200% 100%; animation: bb-session-shimmer 1.4s linear infinite; }
}
@keyframes bb-session-shimmer { from { background-position: 100% 0 } to { background-position: -100% 0 } }
.bb-session-empty { border: 1px dashed var(--border-base); border-radius: 12px; padding: 32px; text-align: center; color: var(--foreground-softer); }
.bb-session-switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--foreground-softer); cursor: pointer; }
.bb-session-switch input { accent-color: var(--primary); width: 14px; height: 14px; }
.bb-session-seg { display: inline-flex; border: 1px solid var(--border-base); border-radius: 8px; overflow: hidden; }
.bb-session-seg a { padding: 5px 10px; font-size: 12px; color: var(--foreground-softer); border-left: 1px solid var(--border-base); white-space: nowrap; }
.bb-session-seg a:first-child { border-left: 0; }
.bb-session-seg a[aria-current=true] { background: var(--background-sunken); color: var(--foreground); font-weight: 600; }
.bb-session-group-label { display: flex; align-items: baseline; gap: 8px; padding-top: 8px; }

/* Variant A: stack cards (PR stack pattern) */
.bb-session-card { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.bb-session-card-right { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
.bb-session-state { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 132px; }
@media (max-width: 1100px) {
  .bb-session-card { grid-template-columns: minmax(0,1fr); }
  .bb-session-card-right { justify-content: space-between; border-top: 1px solid var(--border-base); padding-top: 8px; }
  .bb-session-card-right .bb-session-state { flex-direction: row; align-items: center; gap: 8px; min-width: 0; }
}

/* Variant B: grouped panels (Initiatives pattern) */
.bb-session-grid { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) 150px 190px 72px; gap: 16px; align-items: center; }
.bb-session-head { padding: 8px 16px; font-size: 12px; color: var(--foreground-softer); background: var(--background-sunken); border-top: 1px solid var(--border-base); }
.bb-session-coord { padding: 12px 16px; background: var(--background-sunken); }
.bb-session-coord .bb-session-name { font-weight: 600; }
.bb-session-row { padding: 10px 16px; border-top: 1px solid var(--border-base); }
.bb-session-row:hover { background: color-mix(in oklab, var(--background-sunken) 60%, transparent); }
@media (max-width: 1100px) {
  .bb-session-grid { grid-template-columns: minmax(0,1fr) auto; }
  .bb-session-grid > .bb-session-c-branch, .bb-session-grid > .bb-session-c-harness { display: none; }
  .bb-session-head { display: none; }
  .bb-session-sub-820 { display: block !important; }
}
.bb-session-sub-820 { display: none; }

/* Variant C: outline with attention strip */
.bb-session-outline-row { position: relative; display: grid; grid-template-columns: minmax(0,1fr) 140px 170px 48px; gap: 12px; align-items: center; min-height: 44px; padding: 6px 12px 6px 0; border-top: 1px solid var(--border-base); }
.bb-session-outline-row:first-child { border-top: 0; }
.bb-session-outline-row:hover { background: color-mix(in oklab, var(--background-sunken) 60%, transparent); }
.bb-session-indent { display: flex; align-items: center; min-width: 0; gap: 8px; }
.bb-session-guide { flex: none; align-self: stretch; width: 28px; position: relative; }
.bb-session-guide::before { content: ""; position: absolute; left: 13px; top: -7px; bottom: -7px; border-left: 1px solid var(--border-base); }
.bb-session-guide.is-last::before { bottom: 50%; }
.bb-session-guide.is-elbow::after { content: ""; position: absolute; left: 13px; top: 50%; width: 13px; border-top: 1px solid var(--border-base); }
.bb-session-guide.is-pass::after { display: none; }
.bb-session-guide.is-blank::before { display: none; }
.bb-session-chev { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 6px; color: var(--foreground-softer); }
.bb-session-chev:hover { background: var(--background-sunken); }
.bb-session-attn { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.bb-session-attn a { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--border-base); border-radius: 10px; background: var(--surface); padding: 10px 12px; box-shadow: var(--shadow-base); }
.bb-session-attn a:hover { border-color: var(--primary); }
@media (max-width: 1100px) {
  .bb-session-outline-row { grid-template-columns: minmax(0,1fr) 150px 40px; }
  .bb-session-outline-row > .bb-session-c-age { display: none; }
  .bb-session-outline-meta { display: none; }
  .bb-session-sub-820 { display: block !important; }
}

.bb-session-tone-warning { color: var(--warning); }
.bb-session-tone-danger { color: var(--danger); }
.bb-session-rowlink::after { content: ""; position: absolute; inset: 0; }
.bb-session-outline-row .bb-session-iconbtn, .bb-session-outline-row .bb-session-chev, .bb-session-outline-row a:not(.bb-session-rowlink), .bb-session-outline-row button { position: relative; z-index: 1; }
.bb-session-outline-row:has(.bb-session-rowlink:hover) { background: color-mix(in oklab, var(--background-sunken) 80%, transparent); }
.bb-session-seg a { display: inline-flex; align-items: center; gap: 4px; }
@media (max-width: 1100px) {
  .bb-session-grid.bb-session-row, .bb-session-grid.bb-session-coord { grid-template-columns: minmax(0,1fr) 150px 72px; }
  .bb-session-grid > .bb-session-c-branch, .bb-session-grid > .bb-session-c-harness { display: none; }
}

@media (max-width: 1100px) { .bb-session-headwrap { display: none; } }

<div id="mk-bar" class="mk-bar"></div>
<div id="mk-page"></div>
<script>
(() => {
  // ---------- Real Fluxon class strings, copied from the board's rendered markup ----------
  const BADGE = "size-max inline-flex items-center font-medium justify-center whitespace-nowrap gap-x-1 border [&_.icon]:shrink-0 [&_.icon]:-ms-px h-5.5 px-1.5 text-sm sm:text-xs [&_.icon]:size-3.5 rounded-badge";
  const BADGE_COLOR = {
    neutral: "bg-primary-soft text-foreground-soft border-primary",
    info: "bg-info-soft text-foreground-info-soft border-info",
    warning: "bg-warning-soft text-foreground-warning-soft border-warning",
    outline: "bg-transparent text-foreground-soft border-primary",
    solid: "border-transparent bg-primary text-foreground-primary",
  };
  const BTN = "relative isolate inline-flex items-center justify-center whitespace-nowrap text-sm font-medium no-underline rounded-base outline-hidden shrink-0 border focus-visible:border-focus focus-visible:ring-3 focus-visible:ring-focus transition-[box-shadow] duration-100 disabled:opacity-70 disabled:shadow-none disabled:pointer-events-none data-disabled:opacity-70 data-disabled:shadow-none data-disabled:pointer-events-none [&>.icon]:shrink-0 [&>.icon]:text-[color-mix(in_oklab,currentColor_70%,transparent)] hover:[&>.icon]:text-current ";
  const BTN_OUTLINE = BTN + "border-base bg-control inset-shadow-[0_-1px_0_rgba(0,0,0,.05)] shadow-base before:hidden text-foreground hover:highlight h-8 px-3.5 has-[>.icon]:px-3 gap-x-1.5 [&>.icon]:size-4";
  const BTN_SOLID = BTN + "shadow-base before:absolute before:inset-0 before:border before:border-white/12 before:mask-b-from-0% before:rounded-[calc(var(--radius-base)-1px)] before:pointer-events-none [--btn-hover-opacity:0.15] [--btn-active-opacity:0.22] after:absolute after:inset-0 after:rounded-[inherit] after:bg-current after:opacity-0 after:transition-opacity after:duration-100 after:pointer-events-none hover:after:opacity-[var(--btn-hover-opacity)] active:after:opacity-[var(--btn-active-opacity)] bg-primary text-foreground-primary border-[color-mix(in_oklab,var(--primary),black_12%)] h-9 px-3.5 has-[>.icon]:px-3 gap-x-1.5 [&>.icon]:size-4";

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const icon = (name, cls = "size-4") => `<span class="hero-${name} ${cls}" aria-hidden="true"></span>`;
  const badge = (text, color = "neutral", extra = "") => `<span class="${BADGE} ${BADGE_COLOR[color]} ${extra}">${text}</span>`;

  // ---------- Data: real session names, tickets and branches from the board (2026-11-02) ----------
  // state: working | in_review | idle | waiting | ended | parked. why: reason for waiting.
  const SESSIONS = [
    { id: "coordinator", kind: "main", harness: "claude", model: "opus-5-5", project: "work", ticket: null, branch: null, state: "waiting", why: "cards", cards: 4, age: "4 min" },
    { id: "kpi-countup", kind: "build", parent: "coordinator", harness: "pi", model: "gpt-6-astra", project: "work", ticket: "work-ani", title: "KPI count-up animation freezes partway in tabs that are not painting", branch: "fix/kpi-countup-hidden-tabs", state: "working", age: "6 min" },
    { id: "verify-css-tokens", kind: "build", parent: "coordinator", harness: "pi", model: "gpt-6-astra", project: "work", ticket: "work-ush", title: "verify css-tokens: every class a diff adds exists in the compiled CSS", branch: "main", state: "ended", age: "12 min ago" },
    { id: "card-inbox", kind: "build", parent: "coordinator", harness: "pi", model: "gpt-6-astra", project: "foreman", ticket: "fm-cxv.8", more: 2, title: "Batch similar cards into one", branch: "feat/card-inbox", state: "ended", age: "3 days ago" },
    { id: "pr-forge", kind: "build", parent: "coordinator", harness: "pi", model: "gpt-6-astra", project: "foreman", ticket: "fm-cxv.7", more: 1, title: "Push to an existing PR branch", branch: "feat/pr-forge", state: "ended", age: "3 days ago" },

    { id: "support-board-coord", kind: "epic", parent: "coordinator", harness: "claude", model: "opus-5-5", project: "work", ticket: "work-8ec", title: "In-app ticketing + dev kanban", state: "waiting", why: "cards", cards: 1, age: "7 min" },
    { id: "field-help", kind: "build", parent: "support-board-coord", harness: "pi", model: "gpt-6-astra", project: "work", ticket: "work-8ec.36", title: "Field help tooltips on the Work Board and admin pages", branch: "feat/field-help-tooltips", state: "in_review", age: "14 min" },
    { id: "requester-strip", kind: "build", parent: "support-board-coord", harness: "pi", model: "gpt-6-astra", project: "work", ticket: "work-8ec.34", title: "Support Board ticket page: show who sent the request at a glance", branch: "feat/requester-strip", state: "working", age: "1 min" },

    { id: "query-perf", kind: "epic", parent: "coordinator", harness: "claude", model: "opus-5-5", project: "work", ticket: "work-g4v", title: "App-wide query count reduction", state: "working", age: "now" },
    { id: "help-composer-queries", kind: "build", parent: "query-perf", harness: "pi", model: "gpt-6-astra", project: "work", ticket: "work-g4v.1", title: "Help composer: no queries in the dead render, one draft read", branch: "perf/help-composer-queries", state: "working", age: "3 min" },
    { id: "metric-defs-queries", kind: "build", parent: "query-perf", harness: "pi", model: "gpt-6-astra", project: "work", ticket: "work-g4v.2", title: "Metric definitions: one query, none in the dead render", branch: "perf/metric-defs-queries", state: "waiting", why: "permission", age: "2 min" },

    { id: "ai-chat", kind: "epic", parent: "coordinator", harness: "claude", model: "opus-5-5", project: "work", ticket: "work-p8x", title: "AI Chat Assistant (Ask your data)", state: "waiting", why: "limit", age: "22 min" },
    { id: "chat-why-alerts", kind: "build", parent: "ai-chat", harness: "pi", model: "opus-5-5", project: "work", ticket: "work-p8x.11", title: "Chat: tool calls that bring the matching AI Insights into the answer", branch: "feat/chat-why-alerts", state: "waiting", why: "cards", cards: 1, endedAge: "20 min ago", age: "31 min" },

    { id: "ai-insights", kind: "epic", parent: "coordinator", harness: "claude", model: "opus-5-5", project: "work", ticket: "work-9wb", title: "AI Insights", state: "idle", age: "48 min" },

    { id: "filter-design", kind: "epic", parent: "coordinator", harness: "claude", model: "opus-5-5", project: "work", ticket: "work-n7p", title: "Filter redesign", state: "ended", age: "25 min ago" },
    { id: "filter-bar-production", kind: "build", parent: "filter-design", harness: "pi", model: "gpt-6-astra", project: "work", ticket: "work-n7p.14", title: "Filter bar A slice 5: Production", branch: "feat/filter-bar-production", state: "working", age: "4 min" },

    { id: "maestro", kind: "epic", parent: "coordinator", harness: "claude", model: "opus-5-5", project: "work", ticket: "work-tl7", title: "Marketing Spend Analysis", state: "parked", age: "3 hours ago" },

    { id: "chief-research", kind: "unknown", parent: null, harness: "claude", model: "opus-5-5", project: "foreman", ticket: "fm-9mm", title: "Sessions: live tree and session detail pages", state: "working", age: "1 min" },
    { id: "demo-chat-insights", kind: "unknown", parent: null, harness: "claude", model: "opus-5-5", project: "work", ticket: null, state: "idle", age: "2 hours" },
  ];

  const KIND_TEXT = { main: "main coordinator", epic: "epic coordinator", build: "build", unknown: "no parent" };
  const isDead = s => s.state === "ended" || s.state === "parked";
  const hasLiveChild = s => SESSIONS.some(c => c.parent === s.id && !isDead(c));

  // ---------- ONE shared state function (audit B3): label, colour, icon ----------
  function stateView(s) {
    if (s.state === "waiting") return { text: "Waiting on you", color: "solid", icon: "inbox" };
    if (s.state === "in_review") return { text: "In review", color: "warning" };
    if (s.state === "working") return { text: "Working", color: "info" };
    if (s.state === "idle") return { text: "Idle", color: "neutral" };
    if (s.state === "parked") return { text: "Parked", color: "outline" };
    return { text: "Ended", color: "outline" };
  }
  const stateBadge = s => { const v = stateView(s); return badge((v.icon ? icon(v.icon, "icon") : "") + v.text, v.color); };

  // The short line under the badge: why it waits, or how long.
  function stateLine(s) {
    if (s.state === "waiting" && s.why === "cards") {
      const cards = `<a href="#" class="bb-session-cards">${s.cards} ${s.cards === 1 ? "card" : "cards"}</a>`;
      return s.endedAge ? `${cards} · <span class="bb-session-age">ended ${s.endedAge}</span>` : `${cards} · <span class="bb-session-age">${s.age}</span>`;
    }
    if (s.state === "waiting" && s.why === "permission") return `<span class="bb-session-age">Permission prompt · ${s.age}</span>`;
    if (s.state === "waiting" && s.why === "limit") return `<span class="bb-session-age">Usage limit · ${s.age}</span>`;
    if (isDead(s)) return `<span class="bb-session-age">${s.state === "parked" ? "parked" : "ended"} ${s.age}</span>`;
    return `<span class="bb-session-age">${s.age === "now" ? "active now" : "for " + s.age}</span>`;
  }

  const ticketChip = s => s.ticket
    ? `<a href="#" class="${BADGE} ${BADGE_COLOR.neutral} max-w-full font-mono" title="${esc(s.title || "")}">${esc(s.ticket)}${s.more ? ` +${s.more}` : ""}</a>`
    : `<span class="bb-session-meta">no ticket</span>`;
  const branchChip = s => s.branch ? badge(`<span class="truncate">${esc(s.branch)}</span>`, "neutral", "max-w-full font-mono") : "";
  const harness = s => `<span class="font-mono text-xs text-foreground-softer">${s.harness} · ${s.model}</span>`;
  let TMUX_DOWN = false;
  const focusBtn = s => isDead(s) || TMUX_DOWN
    ? `<span class="bb-session-iconbtn" role="button" aria-disabled="true" title="${TMUX_DOWN ? "tmux is not answering" : "The terminal is closed"}" aria-label="Focus terminal: ${TMUX_DOWN ? "tmux is not answering" : "the terminal is closed"}">${icon("command-line")}</span>`
    : `<button type="button" class="bb-session-iconbtn" title="Focus terminal" aria-label="Focus terminal for ${s.id}">${icon("command-line")}</button>`;
  const openLink = s => `<a href="#" class="bb-session-iconbtn" title="Open session" aria-label="Open ${s.id}">${icon("chevron-right")}</a>`;
  const nameLink = (s, extra = "") => `<a href="#" class="bb-session-name ${extra}">${esc(s.id)}</a>`;
  const parentNote = s => {
    const p = SESSIONS.find(x => x.id === s.parent);
    if (p && isDead(p) && !isDead(s)) return `<span class="bb-session-note">${icon("exclamation-triangle", "size-3.5")} Parent ${p.state} ${p.age}</span>`;
    if (isDead(s) && s.kind !== "build" && hasLiveChild(s)) return `<span class="bb-session-note">Its builds still run</span>`;
    return "";
  };

  // ---------- Tree helpers ----------
  function visible(s, showEnded) {
    if (!isDead(s)) return true;
    if (showEnded) return true;
    return hasLiveChild(s); // R8: a dead coordinator with live builds stays in the tree
  }
  function tree(showEnded) {
    const out = [];
    const walk = (parentId, depth) => SESSIONS.filter(s => (s.parent ?? null) === parentId && s.kind !== "unknown" && visible(s, showEnded))
      .forEach((s, i, arr) => { out.push({ s, depth, last: i === arr.length - 1 }); walk(s.id, depth + 1); });
    walk(null, 0);
    return out;
  }
  const unassigned = showEnded => SESSIONS.filter(s => s.kind === "unknown" && visible(s, showEnded));
  const counts = () => {
    const live = SESSIONS.filter(s => !isDead(s) || s.state === "waiting");
    return {
      working: SESSIONS.filter(s => s.state === "working").length,
      waiting: SESSIONS.filter(s => s.state === "waiting").length,
      review: SESSIONS.filter(s => s.state === "in_review").length,
      ended: SESSIONS.filter(s => isDead(s)).length,
      live: live.length,
    };
  };

  // ---------- Shell (copied from Layouts.app, Sessions added second) ----------
  function shell(main, pending) {
    const nav = (ic, label, active, extra = "") => `<a href="#" class="bb-nav${active ? " bb-nav-active" : ""}" ${active ? 'aria-current="page"' : ""}>${icon(ic)} ${label}${extra}</a>`;
    const project = (k, n) => `<div class="bb-project-row flex items-center gap-1"><a href="#" class="bb-project bb-nav min-w-0 flex-1 text-xs"><span class="bb-project-dot"></span><span class="min-w-0 flex-1 truncate">${k}</span><span class="text-foreground-softer">${n}</span></a><a href="#" class="rounded p-2 text-foreground-softer hover:bg-base hover:text-foreground" aria-label="Documents · ${k}" title="Documents">${icon("document-text")}</a></div>`;
    return `<div class="min-h-screen bg-base text-sm text-foreground md:flex">
  <aside class="flex shrink-0 flex-col gap-6 border-b border-base bg-sunken px-3 py-4 md:sticky md:top-0 md:h-screen md:overflow-y-auto md:w-60 md:border-r md:border-b-0">
    <a href="#" class="flex items-center gap-2.5 px-2.5 py-1 text-[15px] font-semibold">${icon("ellipsis-horizontal-circle", "size-6")} foreman</a>
    <nav aria-label="Main" class="space-y-1">
      <div class="grid">
        <a href="#" class="bb-nav [grid-area:1/1] pr-14">${icon("inbox")} Needs you</a>
        <button type="button" aria-label="Needs you: ${pending} pending requests" class="[grid-area:1/1] self-center justify-self-end mr-2.5 cursor-pointer rounded-full leading-none border border-base bg-base px-2 py-0.5 text-xs font-semibold text-foreground">${pending}</button>
      </div>
      ${nav("rectangle-stack", "Sessions", true)}
      ${nav("chat-bubble-left-right", "Answers")}
      ${nav("bars-3-bottom-left", "Initiatives")}
      ${nav("calendar-days", "This week")}
      ${nav("code-bracket", "Pull requests")}
      ${nav("eye", "Previews")}
      ${nav("cog-6-tooth", "Settings")}
    </nav>
    <section class="space-y-2 px-2.5" aria-label="Projects">
      <h2 class="bb-label">Projects · tickets</h2>
      ${project("work", 334)}${project("foreman", 125)}${project("skills", 40)}${project("dotfiles", 5)}
    </section>
    <div class="mt-auto space-y-4 px-2.5"><div class="flex gap-2">
      <button class="bb-theme" aria-label="Light theme" data-mk-theme="light">${icon("sun")}</button>
      <button class="bb-theme" aria-label="Dark theme" data-mk-theme="dark">${icon("moon")}</button>
    </div></div>
  </aside>
  <main class="min-w-0 flex-1 space-y-5 px-5 pt-6 pb-10 lg:px-7">${main}</main>
</div>`;
  }

  // ---------- Page states ----------
  // live | ended | empty | loading | tmux | offline
  const COPY = {
    title: "Sessions",
    live: "Live",
    updated: "Updated 2 s ago",
    endedToggle: n => `Show ended (last 7 days) · ${n}`,
    emptyTitle: "No sessions are running",
    emptyBody: "Coordinators and their builds show here while they run. Start the main coordinator to begin.",
    emptyCta: "Start main coordinator",
    emptyEnded: "Ended sessions from the last 7 days show when you turn on Show ended.",
    loading: "Loading sessions…",
    tmuxTitle: "Cannot read tmux, so states can be out of date",
    tmuxBody: "The board shows each session as it was at 15:36. Focus terminal does not work until tmux answers. The board tries again every 10 s.",
    tmuxCta: "Try again now",
    offlineTitle: "Not connected to the board. Trying again…",
    offlineBody: "This list stopped updating at 15:38. It updates again when the connection comes back.",
    offlineCta: "Reload page",
    unassignedHelp: "The board knows these sessions but not the coordinator that started them.",
  };

  function header(state, variant) {
    const c = counts();
    const live = state === "offline" ? `<span class="bb-session-live text-xs text-foreground-softer" data-state="off">Not connected · updated 15:38</span>`
      : state === "tmux" ? `<span class="bb-session-live text-xs text-foreground-softer" data-state="stale">tmux not answering · last read 15:36</span>`
      : state === "loading" ? `<span class="bb-session-live text-xs text-foreground-softer" data-state="off">Connecting…</span>`
      : `<span class="bb-session-live text-xs text-foreground-softer">${COPY.live} · ${COPY.updated}</span>`;
    const hasData = !["empty", "loading"].includes(state);
    const countsHtml = hasData ? (variant !== "A" ? "" : `
      <a href="#" class="inline-flex items-center gap-1.5 text-xs text-foreground-softer hover:text-foreground">${badge(icon("inbox", "icon") + "Waiting on you " + c.waiting, "solid")}</a>
      <span class="inline-flex items-center gap-1.5 text-xs text-foreground-softer">${badge("Working " + c.working, "info")}</span>
`) : "";
    return `<header class="flex flex-wrap items-center gap-3">
      <h1 class="text-xl font-semibold mr-1">${COPY.title}</h1>
      ${countsHtml}
      <span class="ml-auto">${live}</span>
    </header>`;
  }

  function endedToggle(state) {
    const on = state === "ended";
    const c = counts();
    return `<label class="bb-session-switch"><input type="checkbox" ${on ? "checked" : ""} data-mk-ended> ${COPY.endedToggle(c.ended)}</label>`;
  }

  function banner(state) {
    if (state === "tmux") return `<div class="bb-session-banner" role="status">${icon("exclamation-triangle", "size-5 bb-session-tone-warning")}<div class="min-w-0 flex-1 space-y-1"><p class="font-medium">${COPY.tmuxTitle}</p><p class="text-xs text-foreground-softer">${COPY.tmuxBody}</p></div><button type="button" class="${BTN_OUTLINE}" phx-disable-with="Trying…">${icon("arrow-path")} ${COPY.tmuxCta}</button></div>`;
    if (state === "offline") return `<div class="bb-session-banner" data-tone="danger" role="status">${icon("signal-slash", "size-5 bb-session-tone-danger")}<div class="min-w-0 flex-1 space-y-1"><p class="font-medium">${COPY.offlineTitle}</p><p class="text-xs text-foreground-softer">${COPY.offlineBody}</p></div><button type="button" class="${BTN_OUTLINE}">${icon("arrow-path")} ${COPY.offlineCta}</button></div>`;
    return "";
  }

  function empty(state) {
    return `<div class="bb-session-empty space-y-3">
      <p class="font-medium text-foreground">${COPY.emptyTitle}</p>
      <p>${COPY.emptyBody}</p>
      <p><button type="button" class="${BTN_SOLID}" phx-disable-with="Starting…">${icon("command-line")} ${COPY.emptyCta}</button></p>
      <p class="text-xs">${COPY.emptyEnded}</p>
    </div>`;
  }

  // ---------- Variant A: stack cards ----------
  function rowA(s, depth, opts = {}) {
    const dead = isDead(s) && s.state !== "waiting";
    const pad = Math.min(depth, 5) * 28;
    const kind = s.kind === "build" ? "" : badge(KIND_TEXT[s.kind]);
    return `<article class="flex gap-3 ${dead ? "bb-session-dead" : ""}" style="padding-left:${pad}px">
      ${depth > 0 ? '<div aria-hidden="true" class="mt-1 h-10 w-4 shrink-0 rounded-bl-lg border-b-2 border-l-2 border-base"></div>' : ""}
      <div class="bb-panel bb-session-card min-w-0 flex-1 !p-4">
        <div class="min-w-0 space-y-1.5">
          <div class="flex flex-wrap items-center gap-2">${nameLink(s)} ${kind} ${ticketChip(s)} ${parentNote(s)}</div>
          ${s.title ? `<p class="truncate text-xs text-foreground-softer" title="${esc(s.title)}">${esc(s.title)}</p>` : ""}
          <div class="flex flex-wrap items-center gap-1.5">${branchChip(s)} ${harness(s)}</div>
        </div>
        <div class="bb-session-card-right">
          <div class="bb-session-state">${stateBadge(s)}<span class="text-xs">${stateLine(s)}</span></div>
          <div class="flex items-center gap-1">${focusBtn(s)}${openLink(s)}</div>
        </div>
      </div>
    </article>`;
  }
  function variantA(state) {
    const showEnded = state === "ended";
    let body;
    if (state === "empty") body = empty();
    else if (state === "loading") body = skeletonA();
    else {
      const rows = tree(showEnded).map(r => rowA(r.s, r.depth)).join("");
      const un = unassigned(showEnded);
      body = `<div class="${state === "offline" ? "bb-session-stale" : ""} space-y-3">${rows}
        ${un.length ? `<div class="bb-session-group-label"><span class="bb-label">Unassigned</span><span class="text-xs text-foreground-softer">${COPY.unassignedHelp}</span></div>${un.map(s => rowA(s, 0)).join("")}` : ""}</div>`;
    }
    return shell(`${header(state, "A")}
      <div class="flex flex-wrap items-center gap-3 text-xs text-foreground-softer"><span class="bb-label">Tree</span><span>main coordinator → epic coordinators → builds</span><span class="ml-auto">${state === "loading" || state === "empty" ? "" : endedToggle(state)}</span></div>
      ${banner(state)}${body}`, 6);
  }
  function skeletonA() {
    const one = d => `<article class="flex gap-3" style="padding-left:${d * 28}px" aria-hidden="true"><div class="mt-1 h-10 w-4 shrink-0 rounded-bl-lg border-b-2 border-l-2 border-base"></div><div class="bb-panel min-w-0 flex-1 !p-4 space-y-2"><span class="bb-session-skel" style="width:30%"></span><span class="bb-session-skel" style="width:55%"></span><span class="bb-session-skel" style="width:22%"></span></div></article>`;
    return `<div class="space-y-3" role="status" aria-live="polite"><p class="text-xs text-foreground-softer">${COPY.loading}</p>${one(0)}${one(1)}${one(2)}${one(1)}</div>`;
  }

  // ---------- Variant B: grouped panels ----------
  function rowB(s, depth) {
    const dead = isDead(s) && s.state !== "waiting";
    const indent = depth > 0 ? `<span aria-hidden="true" class="inline-block h-4 w-3 shrink-0 -mt-2 rounded-bl-md border-b-2 border-l-2 border-base"></span>` : "";
    return `<div class="bb-session-row bb-session-grid ${dead ? "bb-session-dead" : ""}">
      <div class="min-w-0 flex items-start gap-2">${indent}<div class="min-w-0 space-y-0.5">
        <div class="flex flex-wrap items-center gap-2">${nameLink(s)} ${parentNote(s)}</div>
        <p class="truncate text-xs text-foreground-softer" title="${esc(s.title || "")}">${s.title ? esc(s.title) : KIND_TEXT[s.kind]}</p>
        <div class="bb-session-sub-820 pt-1"><div class="flex flex-wrap items-center gap-1.5">${s.ticket ? ticketChip(s) : ""} ${branchChip(s)} ${harness(s)}</div></div>
      </div></div>
      <div class="bb-session-c-branch min-w-0 flex flex-wrap items-center gap-1.5">${ticketChip(s)} ${branchChip(s)}</div>
      <div class="bb-session-c-harness">${harness(s)}</div>
      <div class="flex flex-col items-start gap-1">${stateBadge(s)}<span class="text-xs">${stateLine(s)}</span></div>
      <div class="flex items-center justify-end gap-1">${focusBtn(s)}${openLink(s)}</div>
    </div>`;
  }
  function coordB(s) {
    const dead = isDead(s) && s.state !== "waiting";
    const nBuilds = SESSIONS.filter(c => c.parent === s.id && c.kind === "build" && !isDead(c)).length;
    return `<div class="bb-session-coord bb-session-grid ${dead ? "" : ""}">
      <div class="min-w-0 space-y-0.5"><div class="flex flex-wrap items-center gap-2">${icon(s.kind === "main" ? "rectangle-stack" : "chevron-down", "size-4 text-foreground-softer")}${nameLink(s)} ${badge(KIND_TEXT[s.kind])} ${parentNote(s)}</div>
        <p class="truncate text-xs text-foreground-softer">${s.title ? esc(s.title) : s.kind === "main" ? "Runs epic coordinators and its own builds" : ""}${nBuilds ? ` · ${nBuilds} live ${nBuilds === 1 ? "build" : "builds"}` : ""}</p>
        <div class="bb-session-sub-820 pt-1"><div class="flex flex-wrap items-center gap-1.5">${s.ticket ? ticketChip(s) : ""} ${harness(s)}</div></div></div>
      <div class="bb-session-c-branch min-w-0 flex flex-wrap items-center gap-1.5">${s.ticket ? ticketChip(s) : ""}</div>
      <div class="bb-session-c-harness">${harness(s)}</div>
      <div class="flex flex-col items-start gap-1 ${dead ? "bb-session-dead" : ""}">${stateBadge(s)}<span class="text-xs">${stateLine(s)}</span></div>
      <div class="flex items-center justify-end gap-1">${focusBtn(s)}${openLink(s)}</div>
    </div>`;
  }
  const headB = `<div class="bb-session-head bb-session-grid"><span>Session</span><span>Ticket · branch</span><span>Harness · model</span><span>State</span><span class="text-right">Actions</span></div>`;
  function variantB(state) {
    const showEnded = state === "ended";
    let body;
    if (state === "empty") body = empty();
    else if (state === "loading") body = skeletonB();
    else {
      const main = SESSIONS.find(s => s.kind === "main");
      const mainBuilds = SESSIONS.filter(s => s.parent === main.id && s.kind === "build" && visible(s, showEnded));
      const epics = SESSIONS.filter(s => s.kind === "epic" && visible(s, showEnded));
      const panel = (coord, rows) => `<section class="bb-initiative-panel">${coordB(coord)}${rows.length ? rows.map(r => rowB(r, 1)).join("") : ""}</section>`;
      const un = unassigned(showEnded);
      body = `<div class="${state === "offline" ? "bb-session-stale" : ""} space-y-4">
        <div class="bb-initiative-panel bb-session-headwrap">${headB.replace("bb-session-head ", "bb-session-head !border-t-0 ")}</div>
        ${panel(main, mainBuilds)}
        <div class="space-y-3 pl-7 border-l-2 border-base ml-2">
          ${epics.map(e => panel(e, SESSIONS.filter(s => s.parent === e.id && visible(s, showEnded)))).join("")}
        </div>
        ${un.length ? `<section class="bb-initiative-panel"><h2 class="bb-section-title">Unassigned <span class="text-foreground-softer">${un.length}</span><span class="text-xs font-normal text-foreground-softer">${COPY.unassignedHelp}</span></h2>${un.map(s => rowB(s, 0)).join("")}</section>` : ""}
      </div>`;
    }
    return shell(`${header(state, "B")}
      <div class="flex flex-wrap items-center gap-3">${state === "empty" || state === "loading" ? "" : `<nav class="bb-session-seg" aria-label="Filter sessions"><a href="#" aria-current="true">All</a><a href="#">${icon("inbox", "size-3.5")} Waiting on you ${counts().waiting}</a><a href="#">Working ${counts().working}</a><a href="#">In review ${counts().review}</a></nav>`}<span class="ml-auto">${state === "loading" || state === "empty" ? "" : endedToggle(state)}</span></div>
      ${banner(state)}${body}`, 6);
  }
  function skeletonB() {
    const row = `<div class="bb-session-row bb-session-grid" aria-hidden="true"><span class="bb-session-skel" style="width:60%"></span><span class="bb-session-skel bb-session-c-branch" style="width:70%"></span><span class="bb-session-skel bb-session-c-harness" style="width:80%"></span><span class="bb-session-skel" style="width:50%"></span><span></span></div>`;
    return `<div class="space-y-4" role="status" aria-live="polite"><p class="text-xs text-foreground-softer">${COPY.loading}</p><section class="bb-initiative-panel"><div class="bb-session-coord"><span class="bb-session-skel" style="width:28%"></span></div>${row}${row}</section><section class="bb-initiative-panel ml-9"><div class="bb-session-coord"><span class="bb-session-skel" style="width:22%"></span></div>${row}</section></div>`;
  }

  // ---------- Variant C: outline with an attention strip ----------
  function rowC(r, rowsAll, idx) {
    const { s, depth } = r;
    const dead = isDead(s) && s.state !== "waiting";
    // guides: one column per ancestor level
    let guides = "";
    for (let d = 1; d <= depth; d++) {
      if (d === depth) guides += `<span class="bb-session-guide is-elbow ${r.last ? "is-last" : ""}"></span>`;
      else {
        // does the ancestor at level d have a later sibling? then draw a pass-through line
        const anc = ancestorAt(r, rowsAll, idx, d);
        guides += `<span class="bb-session-guide is-pass ${anc && anc.last ? "is-blank" : ""}"></span>`;
      }
    }
    const isCoord = s.kind !== "build";
    const kids = SESSIONS.filter(c => c.parent === s.id && !isDead(c)).length;
    const chev = isCoord && kids ? `<button type="button" class="bb-session-chev" aria-expanded="true" aria-label="Collapse ${s.id}">${icon("chevron-down", "size-4")}</button>` : `<span class="inline-block w-6"></span>`;
    return `<div class="bb-session-outline-row ${dead ? "bb-session-dead" : ""}" style="padding-left:12px">
      <div class="bb-session-indent">${guides}${chev}
        <div class="min-w-0">
          <div class="flex items-center gap-2 min-w-0">${nameLink(s, (isCoord ? "font-semibold " : "") + "bb-session-rowlink")}<span class="bb-session-outline-meta flex min-w-0 items-center gap-2">${s.kind !== "build" ? `<span class="text-xs text-foreground-softer">${KIND_TEXT[s.kind]}</span>` : ""}${s.ticket ? ticketChip(s) : ""}${s.branch ? `<span class="truncate font-mono text-xs text-foreground-softer">${esc(s.branch)}</span>` : ""}</span>${parentNote(s)}</div>
          <div class="bb-session-sub-820 truncate text-xs text-foreground-softer"><span class="font-mono">${s.ticket ? esc(s.ticket) + " · " : ""}${s.branch ? esc(s.branch) : KIND_TEXT[s.kind]}</span></div>
        </div>
      </div>
      <span class="bb-session-c-age bb-session-outline-meta font-mono text-xs text-foreground-softer">${s.harness} · ${s.model}</span>
      <div class="flex flex-col items-end gap-0.5">${stateBadge(s)}<span class="text-xs">${stateLine(s)}</span></div>
      <div class="flex items-center justify-end">${focusBtn(s)}</div>
    </div>`;
  }
  function ancestorAt(r, rows, idx, level) {
    for (let i = idx - 1; i >= 0; i--) if (rows[i].depth === level) return rows[i];
    return null;
  }
  function attention() {
    const w = SESSIONS.filter(s => s.state === "waiting");
    const reason = s => s.why === "cards" ? `Answer ${s.cards} ${s.cards === 1 ? "card" : "cards"}${s.endedAge ? " · session ended" : ""}` : s.why === "permission" ? "Permission prompt · open the terminal" : "Usage limit · press Continue";
    return `<section class="space-y-2" aria-label="Waiting on you"><div class="flex items-center gap-2"><span class="bb-label">Waiting on you</span>${badge(String(w.length), "solid")}</div>
      <div class="bb-session-attn">${w.map(s => `<a href="#"><span class="flex min-w-0 items-center gap-2">${icon("inbox", "size-4 shrink-0")}<span class="truncate font-medium" title="${esc(s.id)}">${esc(s.id)}</span></span><span class="text-xs text-foreground-softer">${reason(s)} · ${s.age}</span></a>`).join("")}</div></section>`;
  }
  function variantC(state) {
    const showEnded = state === "ended";
    const c = counts();
    let body;
    if (state === "empty") body = empty();
    else if (state === "loading") body = skeletonC();
    else {
      const rows = tree(showEnded);
      const un = unassigned(showEnded);
      body = `<div class="${state === "offline" ? "bb-session-stale" : ""} space-y-5">${attention()}
        <section class="bb-initiative-panel"><h2 class="bb-section-title">All sessions <span class="text-foreground-softer">${rows.length + un.length}</span><span class="text-xs font-normal text-foreground-softer">${c.working} working · ${c.review} in review</span><span class="ml-auto font-normal">${endedToggle(state)}</span></h2>
        <div>${rows.map((r, i) => rowC(r, rows, i)).join("")}</div>
        ${un.length ? `<div class="bb-section-label">Unassigned · ${COPY.unassignedHelp}</div><div>${un.map((s, i) => rowC({ s, depth: 0, last: i === un.length - 1 }, [], 0)).join("")}</div>` : ""}
        </section></div>`;
    }
    return shell(`${header(state, "C")}
      ${banner(state)}${body}`, 6);
  }
  function skeletonC() {
    const row = d => `<div class="bb-session-outline-row" style="padding-left:${12 + d * 28}px" aria-hidden="true"><span class="bb-session-skel" style="width:45%"></span><span class="bb-session-c-age"></span><span class="bb-session-skel" style="width:90px"></span><span></span></div>`;
    return `<div class="space-y-4" role="status" aria-live="polite"><p class="text-xs text-foreground-softer">${COPY.loading}</p><section class="bb-initiative-panel"><h2 class="bb-section-title">All sessions</h2>${row(0)}${row(1)}${row(2)}${row(1)}${row(2)}</section></div>`;
  }

  // ---------- Switcher ----------
  const VARIANTS = { A: ["Stack cards", variantA], B: ["Grouped panels", variantB], C: ["Outline + Waiting strip", variantC] };
  const STATES = { live: "Success (live)", ended: "Show ended on", empty: "Empty", loading: "Loading", tmux: "Error: tmux not answering", offline: "Error: board connection lost" };
  const params = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  let cur = Object.assign({ v: "A", s: "live", t: "auto" }, params());

  function setTheme(t) {
    const root = document.documentElement;
    if (t === "auto") { delete root.dataset.theme; root.style.colorScheme = ""; }
    else { root.dataset.theme = t; root.style.colorScheme = t; }
  }
  function render() {
    setTheme(cur.t);
    if (cur.shot) document.body.classList.add("mk-shot");
    const bar = document.getElementById("mk-bar");
    const group = (key, map) => Object.entries(map).map(([k, v]) => `<button type="button" data-k="${key}" data-v="${k}" aria-pressed="${cur[key] === k}">${Array.isArray(v) ? k + " · " + v[0] : v}</button>`).join("");
    bar.innerHTML = `<b>Sessions page options (mockup)</b>
      <span class="mk-group">Variant: ${group("v", VARIANTS)}</span>
      <span class="mk-group">State: ${group("s", STATES)}</span>
      <span class="mk-group">Theme: ${group("t", { auto: "Auto", light: "Light", dark: "Dark" })}</span>
      <span class="mk-note">Built from the board's compiled CSS and real markup (Layouts.app, PR stack tree, Initiatives panels, Fluxon badges). Data: real session names and tickets from the board on 2026-11-02. Links and buttons do nothing.</span>`;
    TMUX_DOWN = cur.s === "tmux";
    document.getElementById("mk-page").innerHTML = VARIANTS[cur.v][1](cur.s);
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-k]");
    if (b) { cur[b.dataset.k] = b.dataset.v; history.replaceState(null, "", "#" + new URLSearchParams(cur)); render(); return; }
    const t = e.target.closest("[data-mk-theme]");
    if (t) { cur.t = t.dataset.mkTheme; render(); return; }
    const a = e.target.closest("a[href='#']");
    if (a) e.preventDefault();
  });
  document.addEventListener("change", e => {
    if (e.target.matches("[data-mk-ended]")) { cur.s = e.target.checked ? "ended" : "live"; render(); }
  });
  window.addEventListener("hashchange", () => { cur = Object.assign({ v: "A", s: "live", t: "auto" }, params()); render(); });
  render();
})();

</script>
