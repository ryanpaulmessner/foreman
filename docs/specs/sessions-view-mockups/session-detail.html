@property --surface-level {

  inherits: false;
  initial-value: 1;
}
@container fluxon style(--surface-level: 1) {
  .surface {
    --surface-level: 2;
  }
}
@container fluxon style(--surface-level: 2) {
  .surface {
    --surface-level: 3;
  }
}
@container fluxon style(--surface-level: 3) {
  .surface {
    --surface-level: 4;
  }
}

  }

@keyframes fluxon-loading-spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes fluxon-loading-bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}
@keyframes fluxon-loading-fade {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.2;
  }
}
@keyframes fluxon-loading-scale {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(0.1);
  }
}
@keyframes fluxon-loading-bars-scale-fade {
  0% {
    y: 1px;
    height: 22px;
  }
  93.75% {
    y: 5px;
    height: 14px;
    opacity: 0.2;
  }
}
@keyframes fluxon-loading-bars-fade {
  93.75%, 100% {
    opacity: 0.2;
  }
}
@keyframes fluxon-loading-bars-scale {
  0%, 66.66% {
    animation-timing-function: cubic-bezier(0.36, 0.61, 0.3, 0.98);
    y: 6px;
    height: 12px;
  }
  33.33% {
    animation-timing-function: cubic-bezier(0.36, 0.61, 0.3, 0.98);
    y: 1px;
    height: 22px;
  }
}
:root {
  font-family: Inter, system-ui, sans-serif;
}
html[data-theme=light] {
  color-scheme: light;
}
html[data-theme=dark] {
  color-scheme: dark;
}
body {
  margin: 0;
  background: var(--background-base);
}
.bb-panel {
  border: 1px solid var(--border-base);
  border-radius: 10px;
  background: var(--surface);
  padding: 16px;
  box-shadow: var(--shadow-base);
}
.bb-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--foreground-softer);
}
.bb-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 36px;
  padding: 0 10px;
  border-radius: 8px;
  font-weight: 500;
  transition: background .15s;
}
.bb-nav:hover, .bb-theme:hover {
  background: var(--background-accent);
}
.bb-nav:focus-visible {
  outline: 2px solid var(--foreground);
  outline-offset: 2px;
}
a.bb-nav-active {
  background: light-dark(#e4e4e7, #3f3f46);
  color: var(--foreground);
}
.bb-theme {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  width: 36px;
  border: 1px solid var(--border-base);
  border-radius: 8px;
  cursor: pointer;
}
.bb-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
.bb-table th {
  text-align: left;
  font-weight: 500;
  color: var(--foreground-softer);
  font-size: 12px;
  padding: 8px 12px;
  background: var(--background-sunken);
}
.bb-table td {
  padding: 10px 10px;
  white-space: nowrap;
  border-top: 1px solid var(--border-base);
  vertical-align: middle;
}
[data-phx-session], [data-phx-teleported-src] {
  display: contents;
}
.bb-switch {
  appearance: none;
  position: relative;
  width: 36px;
  height: 20px;
  border-radius: 99px;
  background: var(--background-switch);
}
.bb-switch::after {
  content: "";
  position: absolute;
  left: 2px;
  top: 2px;
  width: 16px;
  height: 16px;
  border-radius: 99px;
  background: white;
  box-shadow: 0 1px 2px #0003;
}
.bb-switch:checked {
  background: var(--primary);
}
.bb-switch:checked::after {
  left: 18px;
  background: var(--foreground-primary);
}
.bb-initiative-panel {
  border: 1px solid var(--border-base);
  border-radius: 10px;
  overflow: hidden;
}
.bb-section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--background-sunken);
  font-weight: 600;
}
.bb-initiative-grid {
  display: grid;
  grid-template-columns: 130px minmax(240px,1fr) 100px 130px 86px 50px 35px;
  gap: 16px;
  align-items: center;
  min-width: 970px;
}
.bb-initiative-row {
  padding: 12px 16px;
  border-top: 1px solid var(--border-base);
  transition: background .15s;
}
.bb-initiative-head {
  padding: 10px 16px;
  font-size: 12px;
  color: var(--foreground-softer);
  background: var(--background-sunken);
}
.bb-section-label {
  padding: 8px 16px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .05em;
  background: var(--background-sunken);
  color: var(--foreground-softer);
}
.bb-progress {
  height: 6px;
  background: var(--background-sunken);
  border: 1px solid var(--border-base);
  border-radius: 99px;
  overflow: hidden;
}
.bb-progress span {
  display: block;
  height: 100%;
  background: #22c55e;
}
.bb-histogram {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 28px;
  border-bottom: 1px solid var(--border-base);
}
.bb-histogram span {
  width: 11px;
  border-radius: 2px 2px 0 0;
}
.bb-hist-0 {
  background: #a1a1aa;
}
.bb-hist-1 {
  background: #3b82f6;
}
.bb-hist-2 {
  background: #eab308;
}
.bb-hist-3 {
  background: #22c55e;
}
.bb-hist-4 {
  background: #71717a;
}
.bb-filters .fieldset {
  margin: 0;
  max-width: 210px;
}
.bb-filters .label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--foreground-softer);
}
.bb-filter-control {
  display: block;
  width: 100%;
  height: 36px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--border-base);
  background: var(--background-base);
  color: var(--foreground);
  font-size: 13px;
  box-shadow: 0 1px 2px #0000000d;
}
.bb-ticket {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
}
.bb-ticket-id {
  grid-row: 1;
  grid-column: 1;
}
.bb-ticket-stage {
  grid-row: 1;
  grid-column: 2;
}
.bb-ticket-title {
  grid-column: 1 / -1;
  overflow-wrap: anywhere;
}
@media (min-width: 768px) {
  .bb-ticket {
    display: flex;
  }
}
.bb-project-dot {
  width: 8px;
  height: 8px;
  border-radius: 3px;
  flex-shrink: 0;
  background: #8b5cf6;
}
.bb-project-row:nth-child(3n) .bb-project-dot {
  background: #14b8a6;
}
.bb-project-row:nth-child(3n + 1) .bb-project-dot {
  background: #ec4899;
}
.bb-graph-scroll {
  scrollbar-color: var(--foreground-softer) var(--background-sunken);
  scrollbar-width: auto;
}
.bb-graph-scroll::-webkit-scrollbar {
  height: 12px;
}
.bb-graph-scroll::-webkit-scrollbar-track {
  background: var(--background-sunken);
}
.bb-graph-scroll::-webkit-scrollbar-thumb {
  background: var(--foreground-softer);
  border: 3px solid var(--background-sunken);
  border-radius: 6px;
}
.bb-graph-scroll:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
.fm-markdown {

  max-width: 100%;
  font-size: 14px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.fm-markdown > :first-child {
  margin-top: 0;
}
.fm-markdown > :last-child {
  margin-bottom: 0;
}

  line-height: 1.35;
  margin: 1.8em 0 .7em;
  letter-spacing: -.015em;
}
.fm-markdown h1 {
  font-size: 1.8em;
}
.fm-markdown h2 {
  font-size: 1.4em;
  border-bottom: 1px solid var(--border-base);
  padding-bottom: .4em;
}

<style id="mock-css">
/* Mockup-only layout helpers. Everything uses the board tokens; nothing here
   adds a colour. Classes prefixed sd- would become Tailwind utilities in code. */
.sd-grid-a { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.sd-grid-c { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (width < 1100px) { .sd-grid-a, .sd-grid-c { grid-template-columns: minmax(0, 1fr); } }
.sd-sticky { position: sticky; top: 16px; }
@media (width < 1100px) { .sd-sticky { position: static; } }
.sd-dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.sd-dl dt { color: var(--foreground-softer); }
.sd-dl dd { min-width: 0; overflow-wrap: anywhere; }
.sd-dl-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
@media (width < 1100px) { .sd-dl-2 { grid-template-columns: minmax(0, 1fr); } }
.sd-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; color: var(--foreground-softer); }
.sd-meta .sd-sep { opacity: .5; }
.sd-term { background: #16181d; color: #dee0e1; border-radius: 10px; border: 1px solid var(--border-base);
  font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; overflow: auto; }
.sd-term-body { padding: 10px 0; min-width: max-content; }
.sd-tl { white-space: pre; padding: 0 12px; min-height: 1.45em; }
.sd-term-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #2a2d35;
  color: #9da5a9; font: 12px/1.4 Inter, system-ui, sans-serif; position: sticky; left: 0; top: 0; z-index: 1; background: #16181d; }
.sd-term.sd-stale .sd-term-body { opacity: .55; }
.sd-live-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--success); display: inline-block; }
.sd-live-dot.sd-off { background: var(--foreground-softest); }
.sd-live-dot.sd-warn { background: var(--warning); }
.sd-skel { background: #2a2d35; border-radius: 4px; height: 10px; margin: 8px 12px; }
.sd-skel-l { background: var(--background-sunken); border-radius: 4px; height: 10px; }
.sd-ctl-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.sd-ctl-row > :first-child { width: 100%; }
.sd-reason { font-size: 12px; color: var(--foreground-softer); }
.sd-tlist { position: relative; }
.sd-tlist > li { position: relative; padding-left: 26px; }
.sd-tlist > li::before { content: ""; position: absolute; left: 7px; top: 20px; bottom: -6px; width: 2px; background: var(--border-base); }
.sd-tlist > li:last-child::before { display: none; }
.sd-tdot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  background: var(--background-base); border: 2px solid var(--border-base); }
.sd-tdot .icon { width: 10px; height: 10px; }
.sd-tdot.sd-info { border-color: var(--info); color: var(--info); }
.sd-tdot.sd-warning { border-color: var(--warning); color: var(--warning); }
.sd-tdot.sd-primary { border-color: var(--primary); color: var(--primary); background: var(--primary); }
.sd-tdot.sd-success { border-color: var(--success); color: var(--success); }
.sd-tdot.sd-neutral { color: var(--foreground-softer); }
.sd-round { border-top: 1px solid var(--border-base); }
.sd-round > summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 10px 0; font-weight: 600; font-size: 13px; }
.sd-round > summary::-webkit-details-marker { display: none; }
.sd-round[open] > summary .sd-chev { transform: rotate(90deg); }
.sd-chev { transition: transform .15s; }
.sd-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border-base); }
.sd-tab { padding: 8px 12px; font-size: 13px; font-weight: 500; color: var(--foreground-softer); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; background: none; }
.sd-tab[aria-selected="true"] { color: var(--foreground); border-bottom-color: var(--foreground); }
.sd-next { border-left: 3px solid var(--border-base); }
.sd-next.sd-primary { border-left-color: var(--primary); }
.sd-next.sd-info { border-left-color: var(--info); }
.sd-next.sd-warning { border-left-color: var(--warning); }
.sd-next.sd-neutral { border-left-color: var(--foreground-softest); }
.sd-next.sd-danger { border-left-color: var(--danger); }
.sd-confirm { border: 1px solid var(--danger-border, var(--danger)); background: var(--danger-soft); border-radius: 10px; padding: 14px 16px; }
.sd-btn-danger { background: var(--danger) !important; color: #fff !important; border-color: color-mix(in oklab, var(--danger), black 12%) !important; }
.sd-flash { border-radius: 10px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; border: 1px solid var(--border-base); }
.sd-flash.sd-ok { background: var(--success-soft); border-color: var(--success); }
.sd-flash.sd-err { background: var(--danger-soft); border-color: var(--danger); }
.sd-flash.sd-note { background: var(--background-sunken); }
.sd-copy { display: flex; gap: 6px; }
.sd-copy input { flex: 1; min-width: 0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 6px 8px; border: 1px solid var(--border-base); border-radius: 6px; background: var(--background-sunken); color: var(--foreground); }
.sd-iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-base); background: var(--background-base); cursor: pointer; }
.sd-iconbtn:hover { background: var(--background-sunken); }
.sd-iconbtn[disabled] { opacity: .45; cursor: not-allowed; }
.sd-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sd-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--border-base); border-radius: 999px; font-size: 12px; cursor: pointer; background: var(--background-base); }
.sd-chip[aria-pressed="true"] { background: var(--background-sunken); border-color: var(--foreground-softer); font-weight: 600; }
.sd-child { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border-base); }
.sd-elbow { width: 14px; height: 14px; border-left: 2px solid var(--border-base); border-bottom: 2px solid var(--border-base); border-bottom-left-radius: 8px; margin-top: -8px; flex: none; }
.sd-h1 { font-size: 20px; font-weight: 600; line-height: 1.3; }
.sd-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.sd-link { text-decoration: underline; text-decoration-color: color-mix(in oklab, currentColor 30%, transparent); text-underline-offset: 4px; }
.sd-link:hover { text-decoration-color: currentColor; }
.sd-max { max-width: 768px; }
.sd-maxw { max-width: 1180px; }
.sd-hl { outline: 2px dashed var(--primary); outline-offset: 4px; border-radius: 8px; }
.sd-callout { font-size: 12px; color: var(--foreground-softer); border: 1px dashed var(--border-base); border-radius: 8px; padding: 8px 10px; }

@media (width < 1100px) { .sd-grid-a > aside { order: -1; } }

</style>

const VARIANTS = {

const W = { 1440: "1440", 820: "820" };
const q = new URLSearchParams(location.hash.slice(1));
const cur = { v: q.get("v") || "A", s: q.get("s") || "working", w: +(q.get("w") || 1440), t: q.get("t") || "system", f: q.get("f") || "fit" };

function seg(id, items, key) {

  fr.srcdoc = T("!doctype html") + T(`html lang="en"${theme}`) + T("head") + T('meta charset="utf-8"') + "<style>" + cssCache + "</style>" + T("/head") + T("body") + page(cur.v, cur.s) + T("/body") + T("/html");

function fit() {
  const fr = document.getElementById("frame"), wrap = document.getElementById("wrap");
  const doc = fr.contentDocument; if (!doc || !doc.body) return;
  const h = Math.max(doc.documentElement.scrollHeight, 600);
  fr.style.height = h + "px";
  const avail = document.querySelector(".op-stage").clientWidth - 32;
  const k = cur.f === "fit" ? Math.min(1, avail / (cur.w + 2)) : 1;
  wrap.style.transform = `scale(${k})`;
  wrap.style.width = cur.w + "px";
  wrap.style.height = h * k + "px";
}
window.addEventListener("resize", fit);

function wire(fr) {
  const doc = fr.contentDocument;
  doc.querySelectorAll("[data-scroll-end]").forEach((t) => (t.scrollTop = t.scrollHeight));
  fit();
  new fr.contentWindow.ResizeObserver(fit).observe(doc.body);
  const st = S[cur.s], s = st.subj;
  const result = (cls, ic, html) => {
    const r = doc.querySelector("[data-result]"); if (!r) return;
    r.hidden = false; r.className = "sd-flash " + cls; r.setAttribute("role", "status");
    r.innerHTML = `<span class="hero-${ic} size-4 icon" style="flex:none;margin-top:1px"></span><div>${html}</div>`;
    r.scrollIntoView({ block: "nearest" });

  const busy = (b, text, then) => { const old = b.innerHTML; b.disabled = true; b.textContent = text; setTimeout(() => { b.disabled = false; b.innerHTML = old; then(); }, 900); };
  doc.addEventListener("click", (e) => {
    const a = e.target.closest("a[href='#']"); if (a && !a.dataset.act) e.preventDefault();
    const tab = e.target.closest("[data-tab]");
    if (tab) {
      doc.querySelectorAll("[data-tab]").forEach((t) => t.setAttribute("aria-selected", String(t === tab)));
      doc.querySelectorAll("[data-pane]").forEach((p) => (p.hidden = p.dataset.pane !== tab.dataset.tab));
      doc.querySelectorAll("[data-pane]:not([hidden]) [data-scroll-end]").forEach((t) => (t.scrollTop = t.scrollHeight));

    const chip = e.target.closest("[data-f]");

      doc.querySelectorAll("[data-f]").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
      const f = chip.dataset.f;

        li.hidden = !(f === "all" || f === kind);
      });
      return;
    }
    const b = e.target.closest("[data-act]"); if (!b) return;
    e.preventDefault();

    if (act === "copy") { const inp = b.previousElementSibling; inp.select(); try { navigator.clipboard.writeText(inp.value); } catch (_) {} b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 2000); return; }
    if (act === "open") return result("sd-note", "inbox", `Opens the card on Needs you (<span class="font-mono">/needs-you#request-0ebc66f8</span>).`);
    if (act === "focus") return busy(b, "Focusing…", () => result("sd-ok", "check-circle", `Brought <span class="font-mono">${s.name}</span> to the front in your terminal.`));
    if (act === "message") return result("sd-note", "paper-airplane", `A one-line box opens here: “Message to ${s.name}”, with Send (busy text “Sending…”). Result: “Sent to ${s.name}.”`);
    if (act === "continue") return busy(b, "Continuing…", () => result("sd-ok", "check-circle", `Sent “continue” to <span class="font-mono">${s.name}</span>. The label changes to working when output starts.`));
    if (act === "park") return busy(b, "Parking…", () => result("sd-ok", "check-circle", `Parked <span class="font-mono">${s.name}</span>. The last output is saved. Relaunch is on this page. Its builds keep running.`));
    if (act === "resume") return busy(b, "Resuming…", () => result("sd-ok", "check-circle", `Resumed <span class="font-mono">${s.name}</span> in <span class="font-mono">${s.workdir}</span>. Output shows here in a few seconds.`));
    if (act === "relaunch") return busy(b, "Relaunching…", () => result("sd-ok", "check-circle", st.next.r8 ? `Resumed <span class="font-mono">maestro</span> and sent it the note: “Relaunch the build for work-bih.3 on feat/marketing-mappings-04.” The new build shows under maestro when it starts.` : `Sent <span class="font-mono">maestro</span> the note: “Relaunch the build for work-bih.3 on feat/marketing-mappings-04.” The new build shows under maestro when it starts.`));
    if (act === "retry") return busy(b, "Trying…", () => result("sd-err", "exclamation-triangle", `tmux still does not answer. Check that the tmux server <span class="font-mono">default</span> runs. The board tries again every 5 s.`));
  });
}
window.addEventListener("hashchange", () => {
  const n = new URLSearchParams(location.hash.slice(1));
  ["v", "s", "t", "f"].forEach((k) => n.get(k) && (cur[k] = n.get(k)));
  if (n.get("w")) cur.w = +n.get("w");
  render();
});
render();
</script>
